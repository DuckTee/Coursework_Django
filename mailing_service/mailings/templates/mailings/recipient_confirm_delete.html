{% extends 'base.html' %}

{% block content %}
<h1>Подтверждение удаления</h1>

<p>Вы уверены, что хотите удалить получателя {{ object.full_name }}?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Да, удалить</button>
    <a href="{% url 'recipient_list' %}">Отмена</a>
</form>
{% endblock %}
