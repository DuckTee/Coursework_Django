{% extends 'mailings/base.html' %}
{% load static %}

{% block title %}Регистрация{% endblock %}

{% block content %}

<div class="row">
    <div class="col-3"></div>
    <div class="col-6">
        <div class="card-header">
            Регистрация
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success">Регистрация</button>
            </form>
        </div>
        <div class="card-footer"></div>
    </div>
</div>

{% endblock %}
